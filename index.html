
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Smart NFC Connect</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

:root {
    --purple: #8b5cf6;
    --pink: #ec4899;
    --cyan: #22d3ee;
}

body {
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 25px;
    font-family: 'Outfit', sans-serif;
    color: white;
    background: #090817;
    overflow-x: hidden;
    position: relative;
}

/* Animated background */

body::before,
body::after {
    content: "";
    position: fixed;
    width: 350px;
    height: 350px;
    border-radius: 50%;
    filter: blur(100px);
    opacity: .55;
    z-index: -1;
    animation: float 9s ease-in-out infinite alternate;
}

body::before {
    background: #9333ea;
    top: -100px;
    left: -100px;
}

body::after {
    background: #ec4899;
    bottom: -120px;
    right: -100px;
    animation-delay: -4s;
}

@keyframes float {
    from { transform: translate(0, 0) scale(1); }
    to { transform: translate(70px, 50px) scale(1.3); }
}

/* Main card */

.card {
    width: 100%;
    max-width: 410px;
    padding: 34px 25px;
    position: relative;
    overflow: hidden;
    border-radius: 30px;
    text-align: center;

    background: rgba(255,255,255,.075);
    backdrop-filter: blur(25px);
    -webkit-backdrop-filter: blur(25px);

    border: 1px solid rgba(255,255,255,.18);
    box-shadow: 0 25px 80px rgba(0,0,0,.45);

    animation: cardEnter .9s cubic-bezier(.2,.8,.2,1) both;
}

@keyframes cardEnter {
    from {
        opacity: 0;
        transform: translateY(45px) scale(.94);
    }
    to {
        opacity: 1;
        transform: translateY(0) scale(1);
    }
}

/* Animated top line */

.card::before {
    content: "";
    position: absolute;
    height: 3px;
    width: 100%;
    top: 0;
    left: -100%;
    background: linear-gradient(
        90deg, transparent, #ec4899, #8b5cf6,
        #22d3ee, transparent
    );
    animation: borderMove 4s linear infinite;
}

@keyframes borderMove {
    to { left: 100%; }
}

/* Logo */

.logo {
    width: 170px;
    height: 75px;
    margin: 0 auto 22px;
    border-radius: 20px;

    display: flex;
    align-items: center;
    justify-content: center;

    font-size: 23px;
    font-weight: 800;
    letter-spacing: -0.5px;
    white-space: nowrap;

    color: white;
    background: linear-gradient(135deg, #9333ea, #ec4899);

    box-shadow: 0 0 35px rgba(192,38,211,.45);
    animation: logoFloat 3s ease-in-out infinite;
}

@keyframes logoFloat {
    0%, 100% { transform: translateY(0) rotate(0); }
    50% { transform: translateY(-7px) rotate(3deg); }
}

h1 {
    font-size: 29px;
    font-weight: 800;
    letter-spacing: -.8px;
    background: linear-gradient(90deg, #fff, #d8b4fe, #67e8f9);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
}

.subtitle {
    color: #b9b4d0;
    font-size: 14px;
    margin: 10px 0 30px;
    line-height: 1.6;
}

/* Social buttons */

.social-link {
    position: relative;
    display: flex;
    align-items: center;
    gap: 15px;

    padding: 17px;
    margin-bottom: 15px;
    border-radius: 17px;

    text-decoration: none;
    color: white;

    background: rgba(255,255,255,.07);
    border: 1px solid rgba(255,255,255,.11);

    overflow: hidden;
    transition: transform .35s ease,
                background .35s ease,
                box-shadow .35s ease;

    opacity: 0;
    animation: buttonEnter .6s ease forwards;
}

.social-link:nth-of-type(1) { animation-delay: .25s; }
.social-link:nth-of-type(2) { animation-delay: .4s; }
.social-link:nth-of-type(3) { animation-delay: .55s; }
.social-link:nth-of-type(4) { animation-delay: .7s; }

@keyframes buttonEnter {
    from {
        opacity: 0;
        transform: translateX(-25px);
    }
    to {
        opacity: 1;
        transform: translateX(0);
    }
}

.social-link:hover {
    transform: translateY(-5px) scale(1.025);
    background: rgba(255,255,255,.14);
    box-shadow: 0 12px 30px rgba(0,0,0,.25);
}

.social-link:active {
    transform: scale(.97);
}

.social-link .brand-icon {
    width: 43px;
    height: 43px;
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 13px;
    background: rgba(255,255,255,.1);
    font-size: 23px;
}

.social-link .label {
    text-align: left;
    font-size: 15px;
    font-weight: 600;
}

.social-link .arrow {
    margin-left: auto;
    font-size: 13px;
    color: #b9b4d0;
}

/* Individual colours */

.google {
    background: linear-gradient(110deg, #facc15, #f97316);
    color: #21152d;
    border: none;
    box-shadow: 0 8px 25px rgba(249,115,22,.22);
}

.google .brand-icon {
    background: rgba(255,255,255,.3);
}

.google .arrow {
    color: #21152d;
}

.instagram .brand-icon {
    color: #fb7185;
    background: rgba(236,72,153,.15);
}

.facebook .brand-icon {
    color: #60a5fa;
    background: rgba(59,130,246,.15);
}

.whatsapp .brand-icon {
    color: #4ade80;
    background: rgba(34,197,94,.15);
}

/* Footer */

.footer {
    margin-top: 28px;
    padding-top: 20px;
    border-top: 1px solid rgba(255,255,255,.1);
    color: #aaa5c1;
    font-size: 12px;
    letter-spacing: .5px;
}

.footer i {
    color: #c084fc;
    margin-right: 5px;
}

.footer strong {
    color: #fff;
}

/* Mobile */

@media(max-width: 420px) {
    .card {
        padding: 30px 19px;
    }

    h1 {
        font-size: 26px;
    }
}

/* Reduced motion accessibility */

@media(prefers-reduced-motion: reduce) {
    *, *::before, *::after {
        animation-duration: .01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: .01ms !important;
    }
}
</style>
</head>

<body>

<div class="card">

    <div class="logo">Taha Hussaini</div>

    <h1>Let's Connect!</h1>

    <p class="subtitle">
        One tap. Everything connected.<br>
        Follow us and stay connected.
    </p>

    <a class="social-link google"
       href="https://share.google/OJqbhLL5g8gBHy0Ds"
       target="_blank" rel="noopener">

        <div class="brand-icon">
            <i class="fa-brands fa-google"></i>
        </div>

        <span class="label">Rate Us on Google</span>

        <i class="fa-solid fa-arrow-up-right-from-square arrow"></i>
    </a>

    <a class="social-link instagram"
       href="https://www.instagram.com/_tahahussaini_?vrfl=NnlsYWR2NnJ4ejN5"
       target="_blank" rel="noopener">

        <div class="brand-icon">
            <i class="fa-brands fa-instagram"></i>
        </div>

        <span class="label">Follow on Instagram</span>

        <i class="fa-solid fa-arrow-up-right-from-square arrow"></i>
    </a>

    <a class="social-link facebook"
       href="https://www.facebook.com/share/1DqSFnNqRg/"
       target="_blank" rel="noopener">

        <div class="brand-icon">
            <i class="fa-brands fa-facebook-f"></i>
        </div>

        <span class="label">Connect on Facebook</span>

        <i class="fa-solid fa-arrow-up-right-from-square arrow"></i>
    </a>

    <a class="social-link whatsapp"
       href="https://wa.me/916281509389"
       target="_blank" rel="noopener">

        <div class="brand-icon">
            <i class="fa-brands fa-whatsapp"></i>
        </div>

        <span class="label">Chat on WhatsApp</span>

        <i class="fa-solid fa-arrow-up-right-from-square arrow"></i>
    </a>

    <div class="footer">
        <i class="fa-solid fa-wifi"></i>
        POWERED BY <strong>SMART NFC CONNECT</strong>
    </div>

</div>

</body>
</html>
